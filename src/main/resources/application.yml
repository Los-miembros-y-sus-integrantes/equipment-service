spring:
  application:
    name: equipo
  datasource:
    url: jdbc:h2:mem:equipodb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/gimnasio
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

server:
  port: 8081

keycloak:
  credentials:
    secret: 6NKl3GnnBavPEW1sCJeO19swxYR97feR
  auth-server-url: http://localhost:8080/auth
  realm: gimnasio
  resource: equipment-service
  public-client: false

logging:
  level:
    org.springframework.security: DEBUG

spring:
  application:
    name: clases
  datasource:
    url: jdbc:h2:mem:clasesdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:localhost:8761/eureka/%7D}
  instance:
      hostname: ${EUREKA_INSTANCE:equipment-service}

ribbon:
  eureka:
    enabled: true
  NIWSServerListClassName: com.netflix.niws.loadbalancer.DiscoveryEnabledNIWSServerList